services:
  - type: web
    name: bug-tracker
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bugtracker-db
          property: connectionString

databases:
  - name: bugtracker-db
    plan: free
    databaseName: bugtracker
    user: bugtracker
